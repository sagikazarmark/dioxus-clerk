version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      all:
        patterns:
          - "*"
    exclude-paths:
      - .github/workflows/dagger.yaml
      - .github/workflows/dagger-*.yaml
