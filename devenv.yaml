# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
  extras:
    url: github:sagikazarmark/devenv-extras
    overlays:
      - default
  dagger:
    # https://github.com/dagger/nix/pull/40
    url: github:dagger/nix/b35b2b5ab62ace3a3c1e779c497de1ad762a4aa1
    overlays:
      - default

imports:
  - extras/modules
