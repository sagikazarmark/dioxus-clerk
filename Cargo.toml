[package]
name = "dioxus-clerk"
version = "0.8.0"
description = "Clerk integration for Dioxus: components, hooks, and SSR initial state for web and fullstack apps"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagikazarmark/dioxus-clerk"
homepage = "https://github.com/sagikazarmark/dioxus-clerk"
keywords = ["clerk", "dioxus", "authentication", "auth", "wasm"]
categories = ["authentication", "web-programming", "wasm"]

[features]
default = []
server = [
    "dep:axum",
    "dep:axum-extra",
    "dep:ct-codecs",
    "dep:dioxus-fullstack-core",
    "dep:futures-util",
    "dep:jwk-simple",
    "dep:jwt-simple",
    "dep:reqwest",
    "dep:tower",
    "dep:tracing",
    "dep:url",
    "dep:web-time",
]
# Server on Cloudflare Workers. Axum requires `Send` futures; Workers is
# single-threaded, and the crates this pulls in (tower-worker-fetch, worker)
# mark their JavaScript futures `Send` on that basis, so the middleware future
# is `Send` without wrapping. The JWKS is fetched through the Workers `fetch`
# API instead of reqwest, which has no redirect or timeout control on wasm.
worker = [
    "dep:http-body-util",
    "dep:tower-worker-fetch",
    "jwk-simple/tower",
    "server",
]
# Test helpers that mint Clerk-shaped session tokens from a local key. Enable
# under [dev-dependencies] only: it builds tokens a verifier will accept.
# Deliberately independent of `server`, so a test harness that only needs to
# mint tokens does not pull in axum and reqwest.
testing = ["dep:ct-codecs", "dep:jwt-simple"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json"], optional = true }
axum-extra = { version = "0.12", default-features = false, features = ["cookie"], optional = true }
ct-codecs = { version = "1", optional = true }
dioxus = { version = "0.7.10", default-features = false, features = ["html", "hooks", "macro", "mounted", "signals"] }
dioxus-fullstack-core = { version = "0.7.10", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
jwk-simple = { version = "0.7.0", default-features = false, features = ["http", "jwt-simple"], optional = true }
jwt-simple = { version = "0.15.0", default-features = false, features = ["pure-rust"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tower = { version = "0.5", features = ["util"], optional = true }
tracing = { version = "0.1", optional = true }
url = { version = "2", optional = true }
web-time = { version = "1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util = { version = "0.3", default-features = false }
gloo-timers = { version = "0.4", features = ["futures"] }
http-body-util = { version = "0.1", optional = true }
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
tower-worker-fetch = { version = "0.2", optional = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlHeadElement",
    "HtmlScriptElement",
    "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jwk-simple = { version = "0.7.0", default-features = false, features = ["reqwest"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }

[dev-dependencies]
futures-util = "0.3"
http = "1"
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Serialized event types + converter so native tests can synthesize clicks.
dioxus-html = { version = "0.7", default-features = false, features = ["serialize"] }
# Sign hand-assembled test tokens (malformed headers, missing claims) that no
# JWT library will emit. Not jsonwebtoken: its `rust_crypto` backend pulls in
# p256/p384 0.13 and with them crypto-bigint 0.5 (RUSTSEC-2026-0387).
hmac = "0.13"
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.11"
# Keep validation off transitive releases that require a newer Rust than this crate's MSRV.
simple_asn1 = "=0.6.4"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net"] }
# Keep validation off transitive releases that require a newer Rust than this crate's MSRV.
wiremock = "=0.6.5"

# docs.rs builds with the server feature and --cfg docsrs so the
# feature-requirement badges (doc_cfg) render on feature-gated items.
[package.metadata.docs.rs]
features = ["server", "testing"]
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.release]
sign-commit = true
sign-tag = true
shared-version = true
tag-message = "Release {{version}}"
tag-name = "v{{version}}"
